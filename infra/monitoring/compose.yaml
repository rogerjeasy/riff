name: riff-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d']
  grafana:
    image: grafana/grafana:13.3.0
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${RIFF_GRAFANA_PASSWORD:?Set RIFF_GRAFANA_PASSWORD before starting monitoring}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
volumes:
  prometheus-data:
  grafana-data:
