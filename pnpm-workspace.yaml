packages:
  - apps/*
  - packages/*

linkWorkspacePackages: false
strictPeerDependencies: true
autoInstallPeers: false
minimumReleaseAge: 1440
engineStrict: true
saveExact: true
fetchRetries: 1
fetchTimeout: 15000
storeDir: .cache/store
cacheDir: .cache/pnpm

# Native/build hooks are opt-in, never implicitly trusted.
allowBuilds:
  esbuild: true
  # v13 ships prebuilt binaries and declares gypfile:false; no rebuild is needed.
  better-sqlite3: false
  msw: false

# Security overrides for transitive deps with no fixed release of their parent
# yet (pnpm audit --prod). Remove once @fastify/static, typescript-eslint and
# eslint ship ranges that already resolve to patched versions.
overrides:
  # GHSA-3g3m-2fjr-6pw4 (via @fastify/static).
  'glob@>=9.0.0 <14.0.2': '14.0.3'
  # GHSA-g3hv-75wg-m249 (via typescript-eslint, eslint, glob).
  'minimatch@<11.0.1': '11.0.3'

